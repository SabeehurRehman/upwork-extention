<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upwork Smart Job Shortlister</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🎯 Upwork Shortlister</h1>
      <div class="toggle-container">
        <label class="switch">
          <input type="checkbox" id="enableToggle" checked>
          <span class="slider"></span>
        </label>
        <span id="statusText">Enabled</span>
      </div>
    </header>
    
    <section class="section">
      <h2>Hard Filters</h2>
      <div class="form-group">
        <label>
          <input type="checkbox" id="requirePaymentVerified" checked>
          Require Payment Verified
        </label>
      </div>
      
      <div class="form-group">
        <label for="minHireRate">Minimum Hire Rate (%)</label>
        <input type="number" id="minHireRate" min="0" max="100" value="30">
      </div>
      
      <div class="form-group">
        <label for="minBudget">Minimum Budget ($)</label>
        <input type="number" id="minBudget" min="0" value="0">
      </div>
    </section>
    
    <section class="section">
      <h2>Keywords</h2>
      <div class="form-group">
        <label for="preferredKeywords">Preferred Keywords (comma-separated)</label>
        <input type="text" id="preferredKeywords" placeholder="react, node.js, python">
        <small>Jobs matching these get bonus points</small>
      </div>
      
      <div class="form-group">
        <label for="excludedKeywords">Excluded Keywords (comma-separated)</label>
        <input type="text" id="excludedKeywords" placeholder="data entry, copy paste">
        <small>Jobs with these are automatically rejected</small>
      </div>
    </section>
    
    <section class="section">
      <h2>UI Preferences</h2>
      <div class="form-group">
        <label>
          <input type="checkbox" id="showScoreBadge" checked>
          Show Score Badge
        </label>
      </div>
      
      <div class="form-group">
        <label>
          <input type="checkbox" id="showBorderHighlight" checked>
          Show Border Highlight
        </label>
      </div>
      
      <div class="form-group">
        <label>
          <input type="checkbox" id="showTooltip" checked>
          Show Score Tooltip
        </label>
      </div>
    </section>
    
    <section class="section">
      <h2>Presets</h2>
      <div class="button-group">
        <button id="freelancerPreset" class="btn btn-secondary">Freelancer</button>
        <button id="agencyPreset" class="btn btn-secondary">Agency</button>
      </div>
    </section>
    
    <footer>
      <button id="saveBtn" class="btn btn-primary">Save Settings</button>
      <button id="resetBtn" class="btn btn-secondary">Reset to Defaults</button>
    </footer>
    
    <div id="notification" class="notification hidden"></div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
